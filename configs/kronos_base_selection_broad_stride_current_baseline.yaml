# Same-basket broad-stride check for the current Kronos-small greedy baseline.
name: kronos_base_selection_broad_stride_current_baseline
stage: broad_stride_current_baseline
base_config: configs/kronos_paper_proximal_stride21.yaml
output_dir: outputs/kronos_base_selection/broad_stride_current_baseline
enforce_ridge_gate: false
references:
  current_kronos_metrics: outputs/kronos_checkpoint4_best/metrics.json
  ridge_metrics: outputs/paper_evaluation/metrics.json
min_assets_per_date: 2
calibration_lookback: 20
promotion_thresholds:
  min_return_ic: 0.03
  min_return_rank_ic: 0.03
  min_daily_positive_rate: 0.52
  min_directional_accuracy: 0.525
  min_pred_abs_return_multiple: 0.75
  max_pred_abs_return_multiple: 1.50
  max_positive_rate_gap: 0.15
  max_invalid_ohlc_rate: 0.02
  ridge_rank_ic_tolerance: 0.03
experiments:
  - name: small_greedy_adjusted
    description: Kronos-small adjusted OHLCV greedy decoding.
    overrides:
      model_id: NeoQuasar/Kronos-small
      target_column: Adj Close
      use_adjusted_ohlc: true
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      sample_count: 1
    calibration_modes: [none]
