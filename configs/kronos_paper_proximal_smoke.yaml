# Fast paper-proximal Kronos smoke using the original 10-symbol basket.
# Use this before scaling to configs/kronos_paper_proximal_stride21.yaml.
ticker: AAPL
tickers:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - JPM
  - XOM
  - UNH
  - SPY
start_date: 2015-01-01
eval_start_date: 2020-01-01
end_date: 2024-12-31
context_length: 512
forecast_horizon: 5
target_column: Adj Close
output_dir: outputs/kronos_paper_proximal/base_sample10_smoke
batch_size: 8
eval_stride: 21
model_id: NeoQuasar/Kronos-base
tokenizer_id: NeoQuasar/Kronos-Tokenizer-base
kronos_cache_dir:
device: auto
temperature: 0.6
top_k: 0
top_p: 0.9
sample_count: 10
clip: 5.0
random_seed: 42
use_adjusted_ohlc: true
