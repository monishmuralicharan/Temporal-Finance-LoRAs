# Checkpoint 4 Kronos baseline.
# Uses adjusted OHLCV K-line inputs and scores the day-5 predicted close as a
# 5-day return, matching the existing baseline metric convention.
ticker: AAPL
tickers:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - JPM
  - XOM
  - UNH
  - SPY
start_date: 2015-01-01
eval_start_date: 2020-01-01
end_date: 2024-12-31
context_length: 512
forecast_horizon: 5
target_column: Adj Close
output_dir: outputs/kronos_checkpoint4
batch_size: 32
eval_stride: 1
model_id: NeoQuasar/Kronos-base
tokenizer_id: NeoQuasar/Kronos-Tokenizer-base
kronos_cache_dir:
device: auto
temperature: 1.0
top_k: 0
top_p: 0.9
sample_count: 1
clip: 5.0
random_seed: 42
use_adjusted_ohlc: true
